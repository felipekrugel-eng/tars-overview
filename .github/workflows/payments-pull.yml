# FACADASH — server-side rebuild of the Embedded Payments true-cost / margin
# workbook (loyverse_payments_analysis_ful_V2.xlsx). Modelled on kpi-pull.yml.
#
# Runs entirely on the GitHub runner — no desktop, no manual exports:
#   pull_payments.py  Snowflake Stripe share -> payments-automation/data/*.csv
#   refresh_workbook.py  rebuilds every sheet of the V2 workbook from those CSVs
#   LibreOffice headless  recalculates so the file opens with live values
#   verify  zero genuine formula errors + all 13 sheets + headline cells populated
# then commits the finished .xlsx to payments-automation/output/. That committed file
# is the source of truth, refreshed every 3 hours with zero dependence on anyone's computer.
#
# Fully isolated: only writes under payments-automation/ (data/ + output/), which no
# other workflow touches, so the rebase-retry push never conflicts with the CASE,
# FACADASH (kpi), activation, or cusum pulls sharing this repo.
#
# The risk monitor relies on the verified pull_status.json timestamp, not the
# workbook's build or commit time. GitHub has missed scheduled triggers in this
# repository; the cusum-pull completion heartbeat provides a second wake-up.
name: payments-pull

on:
  schedule:
    # Every 3 hours, all seven days — deliberately the same FREQUENCY as
    # activated-payments-pull ('30 */3 * * *'), because the Payments tab shows Overview and
    # Summary of Margins side by side and they must not disagree. Until 2026-08-07 this ran
    # '0 6 * * 1-5': once a weekday, nothing at weekends, so margins could sit three days
    # behind an Overview that had refreshed ~24 times.
    #
    # Offset to :45 rather than :30 on purpose. activated-payments-pull fires at :30 and this
    # job takes ~7-8 minutes; starting both on the same minute would have them racing to push
    # to master. 15 minutes of separation keeps the pushes clear of each other.
    #
    # Note this run commits the full 11.7 MB workbook each time, which is a deliberate choice
    # to keep the downloadable file as fresh as the dashboard.
    - cron: '45 */3 * * *'
  workflow_run:
    # cusum-pull is also dispatched externally. It completes about every
    # 10 minutes even when GitHub's scheduled payment pull is delayed.
    # The gate below prevents an expensive rebuild on fresh data.
    workflows: ["cusum-pull"]
    types: [completed]
  workflow_dispatch: {}          # manual "Run workflow" button + Cowork trigger
  push:
    # First install / whenever the pipeline code changes: rebuild immediately so the
    # committed output workbook reflects the new logic.
    branches: [master]
    paths:
      - 'payments-automation/pull_payments.py'
      - 'payments-automation/refresh_workbook.py'
      - 'payments-automation/run.py'
      - 'payments-automation/check_pull_freshness.py'
      - 'payments-automation/queries/**'

concurrency:
  group: payments-pull
  cancel-in-progress: false

jobs:
  refresh:
    # cusum-pull failing or being cancelled means no fresh upstream data, so
    # there is nothing for this pull to chase. Guarded 2026-10-19; the cron,
    # push and manual paths are deliberately left alone.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check verified Snowflake pull age
        id: gate
        run: |
          python payments-automation/check_pull_freshness.py \
            --status payments-automation/data/pull_status.json \
            --event "${{ github.event_name }}"

      # Same reason as the gate above: a skip ends green and is otherwise indistinguishable
      # from a refresh. The annotation surfaces in the run LIST, so a run of skips is visible
      # without opening any of them.
      - name: Say whether this run refreshed anything
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.run }}" = "yes" ]; then
            echo "::notice title=Pull RUNNING::the verified Snowflake pull aged out — refreshing"
            echo "### ✅ Pulling — the verified pull manifest aged out" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=SKIPPED — no data refreshed::the last verified pull is still fresh; nothing was pulled, rebuilt or committed"
            echo "### ⏭️ Skipped — NO DATA REFRESHED" >> "$GITHUB_STEP_SUMMARY"
            echo "The last verified Snowflake pull is still within the freshness window, so nothing was pulled, rebuilt or committed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A green tick on this run means the gate declined to work, **not** that the workbook was updated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install LibreOffice (headless recalc)
        if: steps.gate.outputs.run == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Install Python deps
        if: steps.gate.outputs.run == 'yes'
        run: pip install -r payments-automation/requirements.txt

      # ──────────────────────────────────────────────────────────────────────────────
      # WHY THIS IS TWO STEPS AND NOT ONE
      #
      # run.py pulls from Snowflake and then rebuilds a ~56,000 row x 348 column workbook
      # through openpyxl and a headless LibreOffice recalc. On 2026-10-14 the rebuild began
      # exhausting the runner's memory: 28 consecutive runs pulled the data perfectly and
      # then died, and payments-automation/data went 12 hours stale. The risk monitor, which
      # reads transactions.csv, raised transaction_source_stale and went degraded with it.
      #
      # The first attempt at a fix put `if: always()` on the commit step. It did not work,
      # and the run log says exactly why: steps 19 and 20 — GitHub's OWN post-job cleanup —
      # were skipped too. Those run unconditionally unless the runner itself is gone. This
      # is not a process failing, it is the VM dying, and `always()` has nothing left to run
      # on. No conditional can rescue data from a runner that no longer exists.
      #
      # So the data is committed BEFORE the step that can kill the runner ever starts.
      # pull_payments.py writes the CSVs and pull_status.json (with a sha256 per file) and
      # is cheap; the workbook build is what is dangerous. Splitting them means the CSVs,
      # and everything downstream of them, survive a workbook failure by construction
      # rather than by hoping a condition fires.
      # ──────────────────────────────────────────────────────────────────────────────
      - name: Pull from Snowflake
        id: pull
        if: steps.gate.outputs.run == 'yes'
        env:
          # Only the private key is a secret (reused from the CASE/kpi pulls). The rest
          # are plain config, identical to kpi-pull.yml.
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ACCOUNT:   "ORXEAZX-TC97659"
          SNOWFLAKE_USER:      "TARS_SERVICE_USER"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_ROLE:      "DATA_VIEWER"
          SNOWFLAKE_DATABASE:  "LOYVERSE_DATA_LAKE"
          SNOWFLAKE_SCHEMA:    "PUBLIC"
          SQL_DIR:   ${{ github.workspace }}/payments-automation/queries
          DATA_DIR:  ${{ github.workspace }}/payments-automation/data
          TEMPLATE:  ${{ github.workspace }}/payments-automation/template/loyverse_payments_analysis_ful_V2.xlsx
          OUT_DIR:   ${{ github.workspace }}/payments-automation/output
          # Dashboard "Summary of Margins" page reads this; committed below so Netlify redeploys.
          MARGINS_OUT: ${{ github.workspace }}/activated-payments/margins-data.js
        run: python payments-automation/pull_payments.py

      - name: Commit the data before the workbook build can take the runner down
        if: steps.pull.outcome == 'success'
        run: |
          set -uo pipefail
          git config user.name  "payments-bot"
          git config user.email "payments-bot@users.noreply.github.com"

          # Refuse to publish a half-written pull. pull_payments.py records a sha256 for
          # each CSV it wrote, so we can prove the files match rather than trusting that a
          # process which may have been killed left them whole.
          python3 - <<'PY' || { echo "::warning::pull output failed its own checksums — not committing"; exit 0; }
          import hashlib, json, pathlib, sys
          d = pathlib.Path("payments-automation/data")
          st = json.loads((d / "pull_status.json").read_text())
          bad = []
          for name, want in (st.get("sha256") or {}).items():
              f = d / name
              if not f.exists():
                  bad.append(name + ": missing"); continue
              if hashlib.sha256(f.read_bytes()).hexdigest() != want:
                  bad.append(name + ": sha mismatch")
          if bad:
              print("INTEGRITY FAIL: " + "; ".join(bad)); sys.exit(1)
          print("integrity OK: " + ", ".join(sorted(st.get("sha256") or {})))
          PY

          # Only what the pull itself produced. margins-data.js and the workbook come from
          # the rebuild below and are committed by the later step if it survives.
          DATA="payments-automation/data/transactions.csv
                payments-automation/data/icplus_by_charge.csv
                payments-automation/data/platform_fees.csv
                payments-automation/data/pull_status.json"

          git add $DATA
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            git commit -q -m "chore(payments): data pull $(date -u +%FT%TZ)" || true
            if git push; then echo "data published on attempt $i"; exit 0; fi
            echo "push attempt $i failed (master moved) — re-parenting"
            git fetch -q origin master
            git reset -q --mixed origin/master
            git add $DATA
            if git diff --cached --quiet; then echo "remote already has it"; exit 0; fi
            sleep 5
          done
          echo "::warning::could not publish the pulled data after 5 attempts"

      - name: Rebuild -> recalc -> verify the workbook
        if: steps.pull.outcome == 'success'
        env:
          DATA_DIR:  ${{ github.workspace }}/payments-automation/data
          TEMPLATE:  ${{ github.workspace }}/payments-automation/template/loyverse_payments_analysis_ful_V2.xlsx
          OUT_DIR:   ${{ github.workspace }}/payments-automation/output
          # Dashboard "Summary of Margins" page reads this; committed below so Netlify redeploys.
          MARGINS_OUT: ${{ github.workspace }}/activated-payments/margins-data.js
        run: python payments-automation/run.py --no-pull

      # If VERIFY fails, run.py exits BEFORE tidying scratch, so the half-built workbook
      # + LibreOffice recalc output survive. Grab them so we can open the exact file the
      # runner produced and see the offending cells (also printed in the run log above).
      - name: Upload build artifacts on failure (for debugging)
        if: failure() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: payments-build-debug
          path: |
            payments-automation/_build.xlsx
            payments-automation/_recalc/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit & push if the workbook (or CSVs) changed
        # ALWAYS commit whatever the pull managed to produce — the same lesson kpi-pull
        # learned on 2026-08-28, which this workflow never got.
        #
        # run.py pulls the CSVs first and rebuilds the workbook second. When the workbook
        # step dies the CSVs on disk are already complete and correct, but this step used to
        # be skipped with the job, so a perfectly good data pull was thrown away. On
        # 2026-10-14 that happened 20 times in nine hours: every run pulled 56,077
        # transactions successfully, got OOM-killed (exit 137) during the LibreOffice
        # recalc, and discarded the lot. payments-automation/data went 12 hours stale, which
        # also starved the risk monitor — it raised `transaction_source_stale` and went
        # degraded, because its transaction source IS this pull.
        #
        # The integrity check below is what makes this safe: pull_status.json carries a
        # sha256 for every CSV it wrote, so we can prove the files match the status before
        # committing, rather than trusting that a killed process left them whole.
        if: always() && steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "payments-bot"
          git config user.email "payments-bot@users.noreply.github.com"

          # ── WHAT GETS COMMITTED, AND HOW OFTEN ────────────────────────────────────
          # Git keeps every version of every file forever. This job runs ~15x a day, and it
          # used to re-commit an 80 MB fee export and a 67 MB workbook on every single run —
          # about 150 MB of permanent history per run, against roughly 150 MB of actual
          # current data. That is most of how this repository reached 9.5 GB, and it is why
          # `Checkout repo` had started taking minutes in every workflow that clones it.
          #
          # EVERY RUN: only what the dashboard needs to stay on one shared snapshot. The
          # Payment Profile reads the pre-aggregated icplus_by_charge.csv (2.8 MB) instead of
          # the raw fee export (80 MB) — verified to produce identical figures to the cent.
          #
          # ONCE A DAY: the raw fee export and the finished workbook, which exist for
          # analysis and download rather than for the pages. A day old is fine for that, and
          # anything fresher can be pulled straight from Snowflake.
          SMALL="payments-automation/data/transactions.csv
                 payments-automation/data/icplus_by_charge.csv
                 payments-automation/data/platform_fees.csv
                 payments-automation/data/pull_status.json
                 activated-payments/margins-data.js"
          BIG="payments-automation/data/icplus_costs.csv
               payments-automation/output/loyverse_payments_analysis_ful_V2.xlsx
               payments-automation/data/.last_full_export"

          # The marker is a committed file rather than `git log`, because this job checks out
          # shallow and a path's last-commit date is not reliably available in that clone.
          MARKER=payments-automation/data/.last_full_export
          TODAY=$(date -u +%F)
          LAST=$(cat "$MARKER" 2>/dev/null || echo "")
          if [ "$LAST" != "$TODAY" ]; then
            echo "$TODAY" > "$MARKER"
            PATHS="$SMALL $BIG"
            echo "::notice title=Full export committed::daily snapshot of the raw fee export and the workbook"
          else
            PATHS="$SMALL"
            echo "full export already committed today ($LAST) — committing dashboard data only"
          fi

          # Refuse to commit a half-written pull. run.py records a sha256 per CSV in
          # pull_status.json; if the process was killed mid-write those will not match, and
          # committing would publish a torn file that looks fresh.
          python3 - <<'PY' || { echo "::warning::pull output failed its own checksums — not committing data"; exit 0; }
          import hashlib, json, pathlib, sys
          d = pathlib.Path("payments-automation/data")
          st = json.loads((d / "pull_status.json").read_text())
          bad = []
          for name, want in (st.get("sha256") or {}).items():
              f = d / name
              if not f.exists():
                  bad.append(name + ": missing"); continue
              got = hashlib.sha256(f.read_bytes()).hexdigest()
              if got != want:
                  bad.append(name + ": sha mismatch")
          if bad:
              print("INTEGRITY FAIL: " + "; ".join(bad)); sys.exit(1)
          print("integrity OK: " + ", ".join(sorted((st.get("sha256") or {}))))
          PY

          git add $PATHS
          if git diff --cached --quiet; then
            echo "No change — nothing to commit."
          else
            # Other pulls can advance master while we run (~8 min), so a bare push is rejected
            # non-fast-forward. Generated files: the newest generation wins, so re-parent rather
            # than merge. `git pull --rebase` tries to MERGE our regenerated files with the remote
            # copy; an 11.7 MB binary workbook is unmergeable and the rebase then fails identically
            # on every attempt. `reset --soft` moves HEAD to the current remote while KEEPING our
            # index, rebuilding the commit on top of origin/master with our content — no conflict
            # is possible. This job now pushes 8x a day, so that mattered more than it used to.
            for i in 1 2 3 4 5; do
              git fetch -q origin master || { sleep 5; continue; }
              git reset -q --mixed origin/master
              git add $PATHS
              if git diff --cached --quiet; then
                echo "Remote already has this data — nothing to push."; exit 0
              fi
              git commit -q -m "chore(payments): true-cost rebuild $(date -u +%FT%TZ)"
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi
