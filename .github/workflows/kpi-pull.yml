# FACADASH — server-side daily-history refresh.
# Place at .github/workflows/kpi-pull.yml in the dashboard repo.
# Runs the Snowflake "daily as-of" queries → regenerates daily-history.js → commits.
# Netlify auto-deploys on push (no desktop, no manual exports).
name: kpi-pull

on:
  schedule:
    # 04:00 UTC = 5am UK during British Summer Time (≈7am finish, 9am Cyprus for Alex).
    # NOTE: GitHub cron is always UTC and ignores DST. In winter (GMT) this becomes 4am UK;
    # nudge to '0 5 * * *' in late Oct if you want 5am UK year-round.
    - cron: '0 4 * * *'
  workflow_dispatch: {}          # manual "Run workflow" button

concurrency:
  group: kpi-pull
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Six queries run sequentially. Each statement stays under Snowflake's 60m
    # per-statement cap, but the SUM (cohort + receipts + four smaller) plus any
    # warehouse queue wait pushed past the old 150m GitHub cap (exit 143 = SIGTERM).
    # The GitHub runner only IDLE-WAITS on Snowflake, so extra headroom costs no
    # warehouse credits. 330m sits safely under GitHub's 360m hosted-runner ceiling.
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r kpi-automation/requirements.txt

      - name: Pull from Snowflake → regenerate daily-history.js + kpi-data.js
        env:
          # Only the private key is a secret (reused from the CASE pull). The rest are plain config.
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ACCOUNT:   "ORXEAZX-TC97659"
          SNOWFLAKE_USER:      "TARS_SERVICE_USER"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_ROLE:      "DATA_VIEWER"
          SNOWFLAKE_DATABASE:  "LOYVERSE_DATA_LAKE"
          SNOWFLAKE_SCHEMA:    "PUBLIC"
          REPO_DIR:   ${{ github.workspace }}
          SQL_DIR:    ${{ github.workspace }}/kpi-automation/sql
          DAILY_DIR:  ${{ github.workspace }}/Daily DBs Dash Queries
          KPIRUN_DIR: ${{ github.workspace }}/kpi_run
        run: python kpi-automation/run.py

      - name: Commit & push if the data changed
        run: |
          git config user.name  "facadash-bot"
          git config user.email "facadash-bot@users.noreply.github.com"
          git add "KPI Dashboard v2 (Caio)/daily-history.js" "KPI Dashboard v2 (Caio)/kpi-data.js" "KPI Dashboard v2 (Caio)/flow-data.js" "KPI Dashboard v2 (Caio)/daily-flow.js" "KPI Dashboard v2 (Caio)/pilot-data.js" "KPI Dashboard v2 (Caio)/pilot-status.md" "KPI Dashboard v2 (Caio)/cohort-country"
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
          else
            git commit -m "chore(kpi): refresh daily-history.js $(date -u +%FT%TZ)"
            # This job runs ~90 min. The cusum workflow (hourly) and any manual pushes
            # can advance master while we run, so a bare push fails non-fast-forward
            # ("! [rejected] ... fetch first"). Rebase our single generated-data commit
            # onto the latest remote and retry. The files we touch (daily-history.js,
            # kpi-data.js) are written only by this workflow, so rebasing on top of
            # other commits (cusum-data.js, sql, etc.) does not conflict.
            for i in 1 2 3 4 5; do
              # Reset before each attempt. `git pull --rebase` leaves the tree in an UNMERGED
              # state when it hits a conflict, and every later attempt then dies on "Pulling is
              # not possible because you have unmerged files" — so all 5 retries fail for the
              # same reason and the whole run is thrown away at the final step. That is exactly
              # how kpi-pull lost 105 minutes of work on 2026-08-07 when a human commit landed
              # mid-run. Aborting any in-progress rebase makes the retries actually independent.
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin master && git push; then
                echo "pushed on attempt $i"; exit 0
              fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi
