# FACADASH — server-side daily-history refresh.
# Place at .github/workflows/kpi-pull.yml in the dashboard repo.
# Runs the Snowflake "daily as-of" queries → regenerates daily-history.js → commits.
# Netlify auto-deploys on push (no desktop, no manual exports).
name: kpi-pull

on:
  schedule:
    # 04:00 UTC = 5am UK during British Summer Time (≈7am finish, 9am Cyprus for Alex).
    # NOTE: GitHub cron is always UTC and ignores DST. In winter (GMT) this becomes 4am UK;
    # nudge to '0 5 * * *' in late Oct if you want 5am UK year-round.
    # 09:00 UTC, deliberately AFTER the dispatched run (~04:13 + ~96 min) has published, so the
    # guard above can see today's data and skip. Was '0 4 * * *', which raced the dispatch.
    - cron: '0 9 * * *'
  workflow_dispatch: {}          # manual "Run workflow" button

concurrency:
  group: kpi-pull
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Six queries run sequentially. Each statement stays under Snowflake's 60m
    # per-statement cap, but the SUM (cohort + receipts + four smaller) plus any
    # warehouse queue wait pushed past the old 150m GitHub cap (exit 143 = SIGTERM).
    # The GitHub runner only IDLE-WAITS on Snowflake, so extra headroom costs no
    # warehouse credits. 330m sits safely under GitHub's 360m hosted-runner ceiling.
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The cron below is a FAIL-SAFE, not the primary trigger — an external task dispatches this
      # job each morning, and the cron only matters on the days that task does not fire (which has
      # happened: the equivalent cusum trigger stopped on 2026-07-24 and the graph went stale).
      #
      # Without this guard both ran every day: the dispatch succeeded, then the cron run queued
      # behind it, spent ~2 hours on Snowflake, regenerated the same files and died trying to
      # reconcile them with what the first run had already published. Every day from at least
      # 8 Aug. Reading generatedAt out of the checked-out kpi-data.js costs nothing and turns the
      # cron back into what it is meant to be: insurance that fires only when needed.
      - name: Skip the cron run if today's data is already published
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Dispatched run — always proceeds."
            exit 0
          fi
          LAST=$(grep -o '"generatedAt":"[0-9-]\{10\}' "KPI Dashboard v2 (Caio)/kpi-data.js" \
                 | head -1 | grep -o '[0-9-]\{10\}' || true)
          TODAY=$(date -u +%F)
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "kpi-data.js already generated today ($LAST) — cron fail-safe not needed, exiting."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No refresh yet today (last generated $LAST) — cron fail-safe proceeding."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r kpi-automation/requirements.txt

      - name: Pull from Snowflake → regenerate daily-history.js + kpi-data.js
        id: pull
        if: steps.guard.outputs.skip != 'true'
        env:
          # Only the private key is a secret (reused from the CASE pull). The rest are plain config.
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ACCOUNT:   "ORXEAZX-TC97659"
          SNOWFLAKE_USER:      "TARS_SERVICE_USER"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_ROLE:      "DATA_VIEWER"
          SNOWFLAKE_DATABASE:  "LOYVERSE_DATA_LAKE"
          SNOWFLAKE_SCHEMA:    "PUBLIC"
          REPO_DIR:   ${{ github.workspace }}
          SQL_DIR:    ${{ github.workspace }}/kpi-automation/sql
          DAILY_DIR:  ${{ github.workspace }}/Daily DBs Dash Queries
          KPIRUN_DIR: ${{ github.workspace }}/kpi_run
        run: python kpi-automation/run.py

      # ALWAYS commit whatever the pull managed to produce. run.py writes each query's CSVs
      # the moment that query returns and regenerates daily-history.js even when a
      # DEGRADABLE query fails, so on a partial run there is real, fresh data on disk. On
      # 28 Aug the step below was skipped because run.py exited non-zero on a timed-out
      # receipts query, and the day's registrations — already pulled successfully — were
      # thrown away with it. Committing a partial refresh is strictly better than committing
      # nothing: the files not regenerated simply keep their previous contents and produce
      # no diff. `always()` also covers a hard crash midway, for the same reason.
      - name: Commit & push if the data changed
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          set -uo pipefail
          git config user.name  "facadash-bot"
          git config user.email "facadash-bot@users.noreply.github.com"

          # Every path this job is allowed to write. Nothing outside this list may ever end
          # up in the commit — see the STALE INDEX note below for why that used to happen.
          OUT=("KPI Dashboard v2 (Caio)/daily-history.js"
               "KPI Dashboard v2 (Caio)/kpi-data.js"
               "KPI Dashboard v2 (Caio)/flow-data.js"
               "KPI Dashboard v2 (Caio)/daily-flow.js"
               "KPI Dashboard v2 (Caio)/pilot-data.js"
               "KPI Dashboard v2 (Caio)/pilot-status.md"
               "KPI Dashboard v2 (Caio)/cohort-country")

          # ---------------------------------------------------------------------------
          # THE STALE INDEX BUG (fixed 2026-08-29) — reset --MIXED, never --soft.
          #
          # This job runs ~60-90 min. The cusum / payments / ads workflows and any manual
          # push advance master while it runs, so a bare push fails non-fast-forward, and
          # `git pull --rebase` cannot merge large machine-written files (that is how the
          # run failed every day from at least 8 Aug). The previous fix was `reset --soft
          # origin/master`, which moves HEAD to the new remote while KEEPING the index.
          #
          # That is exactly the bug. The index still described the tree from the ORIGINAL
          # checkout, so committing it wrote back the OLD content of every file that had
          # changed on master in the meantime — silently REVERTING other jobs' commits.
          # It stayed invisible for months because the reverted files were other pull
          # workflows' generated data, which their next run simply regenerated. On 29 Aug
          # it reverted .github/workflows/kpi-pull.yml and GitHub refused the push
          # ("refusing to allow a GitHub App to ... update workflow ... without
          # `workflows` permission") — the first time the bug ever surfaced. The same bug
          # was found and fixed in margin-pull / merchant-base-pull on 27 Aug (it wiped the
          # margin workbook); this workflow was simply missed.
          #
          # --mixed resets the INDEX to origin/master while leaving the working tree — and
          # therefore our freshly generated output — untouched. Re-adding only the paths in
          # OUT then produces a tree that is exactly origin/master plus our own files: it
          # cannot conflict, and it cannot revert anyone else's work. (payments-pull and
          # activated-payments-pull already do this; kpi-pull now matches them.)
          # ---------------------------------------------------------------------------
          for i in 1 2 3 4 5; do
            git fetch -q origin master || { sleep 5; continue; }
            git reset -q --mixed origin/master
            # Add only paths that exist on disk or are tracked. `git add -A` aborts the
            # WHOLE add on a single unmatched pathspec, staging nothing — which would then
            # look like "nothing to push" and silently drop a good refresh.
            ADD=()
            for f in "${OUT[@]}"; do
              if [ -e "$f" ] || git cat-file -e "origin/master:$f" 2>/dev/null; then ADD+=("$f"); fi
            done
            if [ ${#ADD[@]} -eq 0 ]; then
              echo "::error::None of the expected output paths exist — refusing to commit."; exit 1
            fi
            git add -A -- "${ADD[@]}"
            if git diff --cached --quiet; then
              echo "Remote already has this data — nothing to push."; exit 0
            fi
            git commit -q -m "chore(kpi): refresh daily-history.js $(date -u +%FT%TZ)"
            # Belt and braces: a commit that reaches outside OUT means the guard above
            # failed. Abort rather than push a revert of someone else's work.
            if git diff --name-only origin/master HEAD | grep -qv '^KPI Dashboard v2 (Caio)/'; then
              echo "::error::Commit touches files outside 'KPI Dashboard v2 (Caio)/' — refusing to push."
              git diff --name-only origin/master HEAD | grep -v '^KPI Dashboard v2 (Caio)/'
              exit 1
            fi
            if git push -q origin master; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i failed (remote moved) — retrying in 5s"
            sleep 5
          done
          echo "push still failing after 5 attempts"; exit 1

      # Surface a partial run AFTER the data is safely committed. run.py exits 0 when a
      # DEGRADABLE query fails, so the commit above is never blocked; this step turns that
      # day red so it does not pass silently and go unnoticed for a week.
      - name: Fail the run if any query degraded
        if: always() && steps.guard.outputs.skip != 'true' && steps.pull.outputs.degraded != ''
        run: |
          echo "::error::kpi-pull published a PARTIAL refresh — degraded: ${{ steps.pull.outputs.degraded }}"
          echo "The series fed by those queries kept their previous values; everything else is fresh."
          echo "Re-dispatch this workflow to backfill: the as-of snapshot window spans ~70 days,"
          echo "so a later successful run fills the missing days in retroactively."
          exit 1
