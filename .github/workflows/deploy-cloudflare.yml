# Mirrors every dashboard data refresh to Cloudflare Pages (facadash.pages.dev +
# activated-payments.pages.dev), which sit behind Cloudflare Access (SSO).
#
# IMPORTANT: this workflow does NOT modify the repo or the Netlify sites in any way.
# It copies the dashboard folders to a temp dir, rewrites the hardcoded
# *.netlify.app cross-links to *.pages.dev IN THE COPY ONLY, and uploads that
# copy to Cloudflare. Netlify keeps deploying the untouched repo content.
#
# When the Netlify sites are eventually decommissioned, fix the links in the
# repo source properly and this rewrite step becomes a no-op.
#
# Added 2026-07-23 (Cowork session, Felipe).

name: deploy-cloudflare

on:
  # NOTE: the scheduled data-refresh workflows push with the built-in GITHUB_TOKEN,
  # and GitHub deliberately does NOT fire `push` workflows for those commits
  # (anti-recursion rule). `workflow_run` is exempt, so we trigger on the pull
  # workflows completing instead. The push trigger still covers human commits.
  workflow_run:
    workflows:
      - kpi-pull
      - payments-pull
      - "PAYMENTS: Daily Activation Pull"
      - "CASE: Daily Snowflake Pull"
    types: [completed]
  push:
    branches: [master]
    paths:
      - "KPI Dashboard v2 (Caio)/**"
      - "activated-payments/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage copies with netlify->pages.dev link rewrite (repo untouched)
        run: |
          mkdir -p /tmp/cf-deploy/facadash /tmp/cf-deploy/activated-payments
          cp -r "KPI Dashboard v2 (Caio)/." /tmp/cf-deploy/facadash/
          cp -r "activated-payments/." /tmp/cf-deploy/activated-payments/
          # automation internals don't need to be served
          rm -rf /tmp/cf-deploy/activated-payments/sql \
                 /tmp/cf-deploy/activated-payments/pull.js \
                 /tmp/cf-deploy/activated-payments/_discovery.json
          find /tmp/cf-deploy -name '*.html' -exec sed -i \
            -e 's|https://activated-payments\.netlify\.app|https://activated-payments.pages.dev|g' \
            -e 's|https://facadash\.netlify\.app|https://facadash.pages.dev|g' {} +

      - name: Deploy facadash to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy /tmp/cf-deploy/facadash --project-name facadash --branch main --commit-dirty=true

      - name: Deploy activated-payments to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy /tmp/cf-deploy/activated-payments --project-name activated-payments --branch main --commit-dirty=true
