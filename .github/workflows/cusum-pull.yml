# FACADASH — hourly registrations CUSUM refresh.
# Regenerates cusum-data.js + cusum-state.json and pushes them to the gh-pages
# branch (served by GitHub Pages), NOT to master. This means a data refresh no
# longer triggers a Netlify deploy — the dashboard fetches cusum-data.js from
# Pages at runtime, so refreshes are free and as frequent as we like.
#
# Triggering: fired hourly by the Cowork "trigger-cusum-pull-hourly" task via
# workflow_dispatch, with a 2-hourly GitHub schedule cron as a FAIL-SAFE — the
# Cowork trigger stops when the user's Claude usage limit runs out (this
# happened on 2026-07-24 and the graph went stale). The concurrency group
# below cancels overlapping runs, so the two triggers cannot collide.
name: cusum-pull

on:
  workflow_dispatch: {}          # manual "Run workflow" button + Cowork hourly trigger
  schedule:
    - cron: '17 */2 * * *'       # fail-safe: every 2 hours at :17 (off the hour to dodge GitHub's cron congestion)

concurrency:
  group: cusum-pull
  # Let an in-flight run FINISH; do not let the next trigger kill it.
  #
  # This used to be `true`, on the reasoning that a still-running job must be stale. That holds
  # only while runs are fast. A run normally takes ~0.7 min, but during GitHub Actions congestion
  # on 2026-08-06 runs stretched to 7-16 min — longer than the ~10 min trigger interval — so every
  # run was cancelled by its successor before it could commit, and the graph froze for 90 minutes
  # while the workflow list looked busy. Cancelling on a timer that can be shorter than the job is
  # a starvation loop: the slower things get, the less likely anything ever completes.
  #
  # With `false`, GitHub queues at most ONE pending run per group and drops older pending ones, so
  # a backlog still cannot build up. Under normal timings this changes nothing.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15           # registrations-only; should finish in 1-3 min
    permissions:
      contents: write
    steps:
      - name: Checkout main repo (scripts + SQL live on master)
        uses: actions/checkout@v4

      - name: Checkout gh-pages (data + state live here)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r kpi-automation/requirements.txt

      - name: Pull registrations CUSUM from Snowflake -> regenerate cusum-data.js into gh-pages/docs
        env:
          # Same single secret as the daily pull. The rest are plain config.
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ACCOUNT:   "ORXEAZX-TC97659"
          SNOWFLAKE_USER:      "TARS_SERVICE_USER"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_ROLE:      "DATA_VIEWER"
          SNOWFLAKE_DATABASE:  "LOYVERSE_DATA_LAKE"
          SNOWFLAKE_SCHEMA:    "PUBLIC"
          SQL_DIR: ${{ github.workspace }}/kpi-automation/sql
          # Write the generated data + state directly into the gh-pages checkout.
          CUSUMDATA_OUT: ${{ github.workspace }}/gh-pages-dir/docs/cusum-data.js
          CUSUM_STATE:   ${{ github.workspace }}/gh-pages-dir/docs/cusum-state.json
        run: python kpi-automation/build_cusum_data.py

      - name: Commit & push to gh-pages if the data changed
        run: |
          cd gh-pages-dir
          git config user.name  "facadash-bot"
          git config user.email "facadash-bot@users.noreply.github.com"
          git add docs/cusum-data.js docs/cusum-state.json
          if git diff --cached --quiet; then
            echo "No CUSUM change — nothing to commit."
          else
            git commit -m "chore(cusum): hourly registrations refresh $(date -u +%FT%TZ)"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin gh-pages && git push origin gh-pages; then
                echo "pushed on attempt $i"
                curl -sf "https://purge.jsdelivr.net/gh/felipekrugel-eng/tars-overview@gh-pages/docs/cusum-data.js" >/dev/null || true   # refresh CDN
                exit 0
              fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi
