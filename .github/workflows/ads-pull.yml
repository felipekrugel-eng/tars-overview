# MARKETING — refresh the Google Ads data behind the Marketing tab.
#
# Reads the Google Ads export sheet, merges it into the history already in
# "KPI Dashboard v2 (Caio)/ads-data.js", and commits. deploy-cloudflare then
# ships it to facadash.pages.dev.
#
# Why server-side instead of the browser fetching the sheet directly (which is
# what the original standalone page did):
#   * the sheet can be locked down — only this job needs to read it
#   * the page is static at serve time, like every other FACADASH page
#   * history accumulates beyond the sheet's own rolling window
#   * a broken pull is a red run here, not a silently stale page
#
# Fully isolated: writes only the two data files under "KPI Dashboard v2 (Caio)".
# The rebase-retry below handles the case where another pull advances master mid-run.
#
# ALSO PULLS PAID ACQUISITION (added 2026-09-23). kpi-automation/pull_paid.js builds
# paid-data.js, the single file marketing.html now runs on: campaign x day spend for Google
# AND Facebook, plus one row per attributed merchant carrying every funnel stage. It
# supersedes the Google Sheet ("Database with mixpanel") entirely.
#
# It rides this workflow rather than taking its own for the same reason attribution did: the
# spend and the merchants on one page should never be more than one run apart. Unlike the
# attribution step it is NOT continue-on-error — marketing.html renders nothing without
# paid-data.js, so a silent failure here is a blank page, and a red run is the cheaper
# outcome.
#
# ALSO PULLS MERCHANT ATTRIBUTION (added 2026-09-17). The Google Ads data stops at the
# click; kpi-automation/pull_attribution.js follows the click through to the Loyverse
# merchant it became. Same page, same cadence, so the two are never more than one run
# apart. That step is non-fatal — attribution is additive, and the page renders without it.
#
# SOURCE — sheet today, Google Ads API as soon as the developer token lands.
# Add the five GOOGLE_ADS_* secrets and this job switches to the API on its own;
# no edit here or in the builder. Until then it reads the sheet. Setup steps are
# in "Marketing Tab — Google Ads API Setup.md".
#
# AUTH (sheet path) — currently running on the public CSV fallback, which only
# works while the sheet stays link-readable. To lock the sheet down: create a
# service account, add its key as the GOOGLE_SERVICE_ACCOUNT_JSON secret, share
# the sheet with the service account's email as Viewer, then remove public link
# sharing. build_ads_data.py picks up the secret automatically.
#
# Added 2026-08-18 (Cowork session, Felipe) with the Marketing tab.
name: ads-pull

on:
  workflow_dispatch:             # manual "Run workflow" button
    inputs:
      source:
        description: 'Where to read from'
        type: choice
        required: false
        default: 'auto'
        options: ['auto', 'api', 'sheet']
      lookback_days:
        description: 'API only — days to re-query. Raise for a one-off backfill.'
        type: string
        required: false
        default: ''
  schedule:
    # Every 3 hours at :40. Off the top of the hour deliberately — GitHub's ':00'
    # slot is congested and delays runs (the same reason cusum-pull sits at :23).
    # The export sheet itself only refreshes a few times a day, so there is no
    # value in going faster.
    - cron: '40 */3 * * *'
  push:
    # Rebuild immediately when the builder changes, so an edit shows up on the
    # page without waiting for a cron.
    branches: [master]
    paths:
      - 'kpi-automation/build_ads_data.py'
      - 'kpi-automation/pull_attribution.js'
      - 'kpi-automation/pull_paid.js'
      - 'kpi-automation/sql/paid_merchants.sql'
      - 'kpi-automation/sql/paid_campaign_daily.sql'

concurrency:
  group: ads-pull
  cancel-in-progress: true       # a queued run has nothing to add over a fresher one

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Was 10 when this only read three small sheets. The attribution pull joins against
    # LOYVERSE_RECEIPTS (~9.6B rows) and takes a couple of minutes, so the job needs more
    # headroom than its own step timeout or the job would kill the step before the step could.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r kpi-automation/requirements-ads.txt

      - name: Pull Google Ads -> regenerate ads-data.js
        env:
          # --- source selection -------------------------------------------
          # "auto" (the scheduled default) uses the API when the secrets below
          # are present and the sheet when they are not, so the cutover is a
          # matter of adding secrets. The dispatch input can force either.
          ADS_SOURCE: ${{ github.event.inputs.source || 'auto' }}
          ADS_API_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}

          # --- Google Ads API (unset until the developer token is approved) --
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # Bump when a version sunsets — v25 goes dark in August 2027, and a
          # sunset shows up as a 404 that the builder explains in the log.
          ADS_API_VERSION: 'v25'

          # --- export sheet (the interim path) ------------------------------
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ADS_SHEET_ID: "1xgbK3Ic9NP2Wv_kiF3nZMoA6ozaHbmRA6tdqLysQRck"

          V2_DIR: ${{ github.workspace }}/KPI Dashboard v2 (Caio)
        run: python kpi-automation/build_ads_data.py

      # ── Merchant attribution ───────────────────────────────────────────────
      # Rides this workflow rather than getting its own: it is the same dashboard, the same
      # cadence, and running the two together means the spend and the merchants on that page
      # are never more than one run apart. It is a SEPARATE step, and deliberately non-fatal
      # — Snowflake being slow or the key missing must not cost us the Google Ads refresh,
      # which is what the page falls back to. marketing.html renders without attribution-data.js.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the Snowflake driver
        run: npm install --no-audit --no-fund --silent snowflake-sdk

      - name: Write the Snowflake key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > snowflake_tars_key.p8

      - name: Pull merchant attribution -> attribution-data.js
        continue-on-error: true
        # The receipts join prunes ~9.6B rows down to the attributed merchants, which takes
        # a couple of minutes. Generous but bounded, so a hung query cannot hold the runner.
        timeout-minutes: 15
        run: node kpi-automation/pull_attribution.js

      # ── Paid acquisition: the file marketing.html actually runs on ─────────
      # NOT continue-on-error, unlike the attribution step above. The page has no fallback
      # for a missing paid-data.js, so failing loudly here is the point.
      - name: Pull paid acquisition -> paid-data.js
        # The merchant query scans LOYVERSE_RECEIPTS. A string floor on RECEIPT_DATE prunes
        # it to ~60s, but the table has no clustering key, so allow for a cold run.
        timeout-minutes: 15
        run: node kpi-automation/pull_paid.js

      - name: Remove the key
        if: always()
        run: rm -f snowflake_tars_key.p8

      - name: Commit & push if the data changed
        run: |
          git config user.name  "facadash-bot"
          git config user.email "facadash-bot@users.noreply.github.com"
          git add "KPI Dashboard v2 (Caio)/ads-data.js" "KPI Dashboard v2 (Caio)/attribution-data.js" \
                  "KPI Dashboard v2 (Caio)/paid-data.js"
          if git diff --cached --quiet; then
            echo "No ad data change — nothing to commit."
          else
            git commit -m "chore(ads): refresh ads + attribution + paid data $(date -u +%FT%TZ)"
            # Other pulls can advance master while we run. We only write two files,
            # so rebasing on their commits never conflicts. Retry 5 times.
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin master && git push; then
                echo "pushed on attempt $i"; exit 0
              fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi
