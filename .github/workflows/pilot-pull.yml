# PILOT TRACKER — standalone refresh for the Pilot subtab.
#
# The pilot query also runs as the last guarded step of kpi-pull, but that workflow
# takes 90-330 minutes (cohort + receipts grids). This one runs the pilot query only,
# so a refresh is a ~2 minute job you can fire from the Actions tab whenever you want
# a current answer.
#
# Fully isolated: writes only "KPI Dashboard v2 (Caio)/pilot-data.js" and
# "pilot-status.md" — the same two files kpi-pull writes. If both run at once the
# rebase-retry below handles it, and whichever finishes last wins with identical data.
#
# Added 2026-08-12 alongside the v2 page rewrite (revenue + counterfactual).
name: pilot-pull

on:
  workflow_dispatch: {}          # manual "Run workflow" button — the main way to use this
  schedule:
    # 05:10 UTC daily. Deliberately AFTER kpi-pull starts (04:00) but on its own
    # connection, so the pilot page is current by breakfast even when the long
    # kpi-pull run is still grinding through the receipts grid.
    - cron: '10 5 * * *'
  push:
    # Rebuild immediately when the pilot pipeline code changes, so a SQL or builder
    # edit is reflected on the page without waiting for a cron.
    branches: [master]
    paths:
      - 'kpi-automation/pilot_run.py'
      - 'kpi-automation/build_pilot_data.py'
      - 'kpi-automation/sql/pilot_history_adoption_daily.sql'

concurrency:
  group: pilot-pull
  cancel-in-progress: true       # a queued run has nothing to add over a fresher one

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # the query is ~1.5M invoice line items; minutes, not hours
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r kpi-automation/requirements.txt

      - name: Pull pilot adoption + revenue from Snowflake -> regenerate pilot-data.js
        env:
          # Only the private key is a secret, reused from the other pulls. The rest
          # are plain config, identical to kpi-pull.yml.
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ACCOUNT:   "ORXEAZX-TC97659"
          SNOWFLAKE_USER:      "TARS_SERVICE_USER"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_ROLE:      "DATA_VIEWER"
          SNOWFLAKE_DATABASE:  "LOYVERSE_DATA_LAKE"
          SNOWFLAKE_SCHEMA:    "PUBLIC"
          REPO_DIR: ${{ github.workspace }}
          SQL_DIR:  ${{ github.workspace }}/kpi-automation/sql
          V2_DIR:   ${{ github.workspace }}/KPI Dashboard v2 (Caio)
        run: python kpi-automation/pilot_run.py

      - name: Commit & push if the data changed
        run: |
          git config user.name  "facadash-bot"
          git config user.email "facadash-bot@users.noreply.github.com"
          git add "KPI Dashboard v2 (Caio)/pilot-data.js" "KPI Dashboard v2 (Caio)/pilot-status.md"
          if git diff --cached --quiet; then
            echo "No pilot data change — nothing to commit."
          else
            git commit -m "chore(pilot): refresh pilot-data.js $(date -u +%FT%TZ)"
            # Other pulls can advance master while we run. We only write the two pilot
            # files, so rebasing on top of their commits never conflicts. Retry 5 times.
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin master && git push; then
                echo "pushed on attempt $i"; exit 0
              fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi
