name: Loyverse risk credential check
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - .github/workflows/loyverse-risk-credentials-check.yml
      - risk-monitor/check_credentials.py
permissions:
  contents: read
jobs:
  credentials:
    if: github.repository == 'felipekrugel-eng/tars-overview' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: risk-monitor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r risk-monitor/requirements.txt
      - name: Verify saved Stripe and Gmail credentials without side effects
        env:
          STRIPE_RISK_READ_KEY: ${{ secrets.STRIPE_RISK_READ_KEY }}
          GMAIL_RISK_OAUTH_JSON: ${{ secrets.GMAIL_RISK_OAUTH_JSON }}
        run: python risk-monitor/check_credentials.py
