# AD-HOC Snowflake query runner — manual dispatch only, prints results to the job log.
# Added 2026-07-24 for one-off cohort questions; safe to delete when no longer needed.
name: "ADHOC: Snowflake query"
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script under adhoc/ to run"
        required: false
        default: "pos-transacting.js"
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # raised 2026-07-28: the per-country rolling query needs ~15-25m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install snowflake-sdk
      - name: Write Snowflake private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > snowflake_tars_key.p8
      - name: Run ad-hoc query
        run: node "adhoc/${{ inputs.script || 'pos-transacting.js' }}"
      - name: Clean up key
        if: always()
        run: rm -f snowflake_tars_key.p8
