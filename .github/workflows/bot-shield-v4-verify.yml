# BOT SHIELD v4 — verify and sweep. Runs in Actions so the Snowflake key never leaves it.
#
# Read-only against Snowflake. Compiles every query that carries the bot CTE, then runs the
# false-positive sweep and prints a CLEAR / REVIEW / STOP verdict in the job log.
# Nothing here writes to Snowflake, commits, or touches a dashboard.
name: bot-shield-v4-verify

# workflow_dispatch alone is not enough: GitHub only offers "Run workflow" for files that
# are already on the default branch, so a verification job living on the branch it verifies
# can never be clicked. pull_request fixes that — a same-repo PR runs the workflow from the
# PR's own head, with the repo secrets available, so opening the PR IS the verification.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'bot-filter/**'
      - '**/sql/**'
      - 'merchant-base-automation/queries/**'

# Keyed by ref, not by workflow. A single group meant a dispatch against master cancelled
# the PR's own run mid-checkout — which is exactly what happened on the first attempt.
concurrency:
  group: bot-shield-v4-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the branch under test
        uses: actions/checkout@v4

      - name: Refuse to "verify" a ref that does not carry the fix
        # The first run of this workflow was dispatched against master by accident and
        # reported success without testing anything. Fail loudly instead.
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in bot-filter/v4_sweep.js bot-filter/cte_block.sql; do
            [ -f "$f" ] || { echo "::error::$f is not on ${{ github.ref_name }}"; missing=1; }
          done
          if ! grep -q 'protected_accounts' bot-filter/cte_block.sql 2>/dev/null; then
            echo "::error::cte_block.sql here is not the v4 block"; missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::Dispatch this against fix/bot-shield-v4-behavioural, not master."
            exit 1
          fi
          echo "ref ${{ github.ref_name }} carries the v4 fix — proceeding"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install snowflake-sdk
        run: npm install --no-audit --no-fund

      - name: Block is identical across all 15 reference files
        run: python3 bot-filter/verify_cte.py

      - name: Alert script parses
        run: node --check bot-filter/daily_bot_screen.js

      - name: Every query compiles
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ACCOUNT:   "ORXEAZX-TC97659"
          SNOWFLAKE_USER:      "TARS_SERVICE_USER"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_ROLE:      "DATA_VIEWER"
          SNOWFLAKE_DATABASE:  "LOYVERSE_DATA_LAKE"
          SNOWFLAKE_SCHEMA:    "PUBLIC"
        run: node bot-filter/verify_sql.js

      - name: False-positive sweep
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ACCOUNT:   "ORXEAZX-TC97659"
          SNOWFLAKE_USER:      "TARS_SERVICE_USER"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_ROLE:      "DATA_VIEWER"
          SNOWFLAKE_DATABASE:  "LOYVERSE_DATA_LAKE"
          SNOWFLAKE_SCHEMA:    "PUBLIC"
        # `node ... | tee` without pipefail takes tee's exit status, so a crashing sweep
        # reported success. That is how the first run passed while producing nothing.
        shell: bash
        run: |
          set -euo pipefail
          node bot-filter/v4_sweep.js | tee -a "$GITHUB_STEP_SUMMARY"
