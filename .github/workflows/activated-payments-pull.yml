# PAYMENTS ACTIVATION — daily Snowflake refresh for the activated-payments dashboard.
# Pulls the live payments-activated merchant population from the Stripe data share in
# Snowflake (CONNECTED_ACCOUNTS), regenerates activated-payments/activation-data.js,
# and commits it. Netlify auto-deploys the activated-payments site on push — no manual
# uploads. Fully isolated: only touches files under activated-payments/.
name: "PAYMENTS: Daily Activation Pull"

on:
  schedule:
    # Every 3 hours at :30 — matches Stripe Data Pipeline's ~3h delivery cadence into
    # Snowflake (fresher runs buy nothing). Offset from the CASE (06:00) and FACADASH
    # (04:00) pulls so the single shared warehouse isn't hit by three jobs at once.
    - cron: "30 */3 * * *"
  workflow_dispatch: {}
  # RIDE THE ONE TRIGGER THAT ACTUALLY FIRES.
  #
  # GitHub drops the `schedule` event in this repo. On 2026-08-27 every scheduled workflow —
  # this one, ads-pull, payments-pull — stopped for eight hours while manual dispatch kept
  # working, and the workflow comments record the same thing happening in July and on 08-06.
  # A cron you cannot rely on is worse than no cron, because it fails silently.
  #
  # cusum-pull, by contrast, is dispatched externally every few minutes and never misses. This
  # hooks onto its completion and uses it as a heartbeat. `workflow_run` needs no PAT and no
  # machine of Felipe's to be awake — unlike a scheduled task, which stops the moment his
  # computer sleeps or his usage limit runs out.
  #
  # The heartbeat is far faster than this job should run, so the first step below exits unless
  # the committed data is genuinely stale. Those no-op runs finish in seconds.
  workflow_run:
    workflows: ["cusum-pull"]
    types: [completed]
  push:
    # Auto-run when the dashboard code or pull script changes (e.g. this first commit),
    # so the seed activation-data.js is immediately replaced with a live pull.
    branches: [master]
    paths:
      - "activated-payments/**"

concurrency:
  # The heartbeat gets its own lane. GitHub keeps at most one PENDING run per group and drops
  # older ones, so once cusum-pull started chaining into this workflow every few minutes, a
  # deliberate manual dispatch could be dropped by a heartbeat no-op queued behind it — which is
  # exactly what happened on 2026-08-27. Separating the lanes means a heartbeat can never cancel
  # a run someone asked for. Two real pulls still cannot overlap in practice: a dispatch leaves
  # the data fresh, so the next heartbeat gates itself out.
  group: activated-payments-pull-${{ github.event_name == 'workflow_run' && 'heartbeat' || 'direct' }}
  cancel-in-progress: false

jobs:
  pull-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the staleness gate reads the data file's commit time

      # Only meaningful for the cusum heartbeat, which fires far more often than this job should
      # run. Every other trigger — manual, push, or the cron on the days it works — is deliberate
      # and passes straight through. Staleness is measured from the COMMIT TIME of the generated
      # data rather than from run history: it is the thing the dashboard actually serves, so a run
      # that succeeded but committed nothing does not count as fresh.
      - name: Skip unless the data is stale
        id: gate
        run: |
          MAX_AGE_MIN=170          # just under 3h, so a 3-hourly rhythm is never skipped by drift
          LAST=$(git log -1 --format=%ct -- activated-payments/funnel-data.js || echo 0)
          NOW=$(date -u +%s)
          AGE=$(( (NOW - LAST) / 60 ))
          echo "data last committed ${AGE} min ago (limit ${MAX_AGE_MIN})"
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "triggered by ${{ github.event_name }} — running regardless of age"
          elif [ "$AGE" -ge "$MAX_AGE_MIN" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "fresh enough — skipping"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: npm install snowflake-sdk

      - name: Write Snowflake private key
        if: steps.gate.outputs.run == 'yes'
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > snowflake_tars_key.p8

      - name: Run payments activation pull
        if: steps.gate.outputs.run == 'yes'
        env:
          # Optional. Only used to resolve terminal reader ids to device models (M2 / S710 / Tap
          # to Phone), which the Stripe data share does not replicate for connected accounts.
          # Absent, the pull still succeeds and the Payment Profile page falls back to showing how
          # the card was read. Needs Terminal read access only.
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: node activated-payments/pull.js

      - name: Commit & push if the data changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "payments-bot"
          git config user.email "payments-bot@users.noreply.github.com"
          # Only the generated data + discovery artifact — never the dashboard source.
          git add activated-payments/activation-data.js activated-payments/overview-data.js activated-payments/funnel-data.js activated-payments/report-data.js activated-payments/profile-data.js activated-payments/_discovery.json "KPI Dashboard v2 (Caio)/payments-cohort.json"
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
          else
            git commit -m "chore(payments): daily activation pull $(date -u +%FT%TZ)"
            # Other daily pulls (CASE 06:00, FACADASH 04:00, cusum hourly) can advance
            # master while we run, causing a non-fast-forward push. We only write files
            # under activated-payments/, which no other workflow touches, so rebasing on
            # top of their commits never conflicts. Retry up to 5 times.
            # Generated files: the newest generation wins, so re-parent rather than merge.
            # `git pull --rebase` tries to MERGE our regenerated files with the remote copy;
            # machine-written files are unmergeable and the rebase fails identically on every
            # attempt. `reset --soft` moves HEAD to the current remote while KEEPING our index,
            # rebuilding the commit on top of origin/master with our content — cannot conflict.
            for i in 1 2 3 4 5; do
              git fetch -q origin master || { sleep 5; continue; }
              git reset -q --mixed origin/master
              git add activated-payments/activation-data.js activated-payments/overview-data.js activated-payments/funnel-data.js activated-payments/report-data.js activated-payments/profile-data.js activated-payments/_discovery.json "KPI Dashboard v2 (Caio)/payments-cohort.json"
              if git diff --cached --quiet; then
                echo "Remote already has this data — nothing to push."; exit 0
              fi
              git commit -q -m "chore(payments): daily activation pull $(date -u +%FT%TZ)"
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi

      - name: Clean up key
        if: always()
        run: rm -f snowflake_tars_key.p8
