# PAYMENTS ACTIVATION — daily Snowflake refresh for the activated-payments dashboard.
# Pulls the live payments-activated merchant population from the Stripe data share in
# Snowflake (CONNECTED_ACCOUNTS), regenerates activated-payments/activation-data.js,
# and commits it. Netlify auto-deploys the activated-payments site on push — no manual
# uploads. Fully isolated: only touches files under activated-payments/.
name: "PAYMENTS: Daily Activation Pull"

on:
  schedule:
    # Every 3 hours at :30 — matches Stripe Data Pipeline's ~3h delivery cadence into
    # Snowflake (fresher runs buy nothing). Offset from the CASE (06:00) and FACADASH
    # (04:00) pulls so the single shared warehouse isn't hit by three jobs at once.
    - cron: "30 */3 * * *"
  workflow_dispatch: {}
  push:
    # Auto-run when the dashboard code or pull script changes (e.g. this first commit),
    # so the seed activation-data.js is immediately replaced with a live pull.
    branches: [master]
    paths:
      - "activated-payments/**"

concurrency:
  group: activated-payments-pull
  cancel-in-progress: false

jobs:
  pull-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install snowflake-sdk

      - name: Write Snowflake private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > snowflake_tars_key.p8

      - name: Run payments activation pull
        run: node activated-payments/pull.js

      - name: Commit & push if the data changed
        run: |
          git config user.name  "payments-bot"
          git config user.email "payments-bot@users.noreply.github.com"
          # Only the generated data + discovery artifact — never the dashboard source.
          git add activated-payments/activation-data.js activated-payments/overview-data.js activated-payments/funnel-data.js activated-payments/report-data.js activated-payments/_discovery.json "KPI Dashboard v2 (Caio)/payments-cohort.json"
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
          else
            git commit -m "chore(payments): daily activation pull $(date -u +%FT%TZ)"
            # Other daily pulls (CASE 06:00, FACADASH 04:00, cusum hourly) can advance
            # master while we run, causing a non-fast-forward push. We only write files
            # under activated-payments/, which no other workflow touches, so rebasing on
            # top of their commits never conflicts. Retry up to 5 times.
            # Generated files: the newest generation wins, so re-parent rather than merge.
            # `git pull --rebase` tries to MERGE our regenerated files with the remote copy;
            # machine-written files are unmergeable and the rebase fails identically on every
            # attempt. `reset --soft` moves HEAD to the current remote while KEEPING our index,
            # rebuilding the commit on top of origin/master with our content — cannot conflict.
            for i in 1 2 3 4 5; do
              git fetch -q origin master || { sleep 5; continue; }
              git reset -q --mixed origin/master
              git add activated-payments/activation-data.js activated-payments/overview-data.js activated-payments/funnel-data.js activated-payments/report-data.js activated-payments/_discovery.json "KPI Dashboard v2 (Caio)/payments-cohort.json"
              if git diff --cached --quiet; then
                echo "Remote already has this data — nothing to push."; exit 0
              fi
              git commit -q -m "chore(payments): daily activation pull $(date -u +%FT%TZ)"
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi

      - name: Clean up key
        if: always()
        run: rm -f snowflake_tars_key.p8
