# PAYMENTS ACTIVATION — daily Snowflake refresh for the activated-payments dashboard.
# Pulls the live payments-activated merchant population from the Stripe data share in
# Snowflake (CONNECTED_ACCOUNTS), regenerates activated-payments/activation-data.js,
# and commits it. Netlify auto-deploys the activated-payments site on push — no manual
# uploads. Fully isolated: only touches files under activated-payments/.
name: "PAYMENTS: Daily Activation Pull"

on:
  schedule:
    # Every 3 hours at :30 — matches Stripe Data Pipeline's ~3h delivery cadence into
    # Snowflake (fresher runs buy nothing). Offset from the CASE (06:00) and FACADASH
    # (04:00) pulls so the single shared warehouse isn't hit by three jobs at once.
    - cron: "30 */3 * * *"
  workflow_dispatch: {}
  # RIDE THE ONE TRIGGER THAT ACTUALLY FIRES.
  #
  # GitHub drops the `schedule` event in this repo. On 2026-08-27 every scheduled workflow —
  # this one, ads-pull, payments-pull — stopped for eight hours while manual dispatch kept
  # working, and the workflow comments record the same thing happening in July and on 08-06.
  # A cron you cannot rely on is worse than no cron, because it fails silently.
  #
  # cusum-pull, by contrast, is dispatched externally every few minutes and never misses. This
  # hooks onto its completion and uses it as a heartbeat. `workflow_run` needs no PAT and no
  # machine of Felipe's to be awake — unlike a scheduled task, which stops the moment his
  # computer sleeps or his usage limit runs out.
  #
  # The heartbeat is far faster than this job should run, so the first step below exits unless
  # the committed data is genuinely stale. Those no-op runs finish in seconds.
  # ALSO CHAINED TO payments-pull, and that one is not a heartbeat — it is an ORDERING
  # CONSTRAINT, and the reason the two payments pages can now be trusted against each other.
  #
  # payments-pull takes the single Snowflake snapshot of the charge-level facts and commits it
  # together with the margins page built from it. This job builds the Payment Profile from that
  # same committed snapshot. So the moment a new snapshot lands, the profile must be rebuilt on
  # it — otherwise margins is showing vintage N while the profile is still showing N-1, which
  # is precisely the "different numbers on two pages" this whole design removes. Chaining here
  # closes that window to one job length instead of up to three hours.
  #
  # The cusum heartbeat stays for everything in this job that is NOT from the snapshot —
  # accounts, registrations, KYC, subscriptions, acceptance — which has its own cadence and no
  # counterpart on the margins page to disagree with.
  workflow_run:
    workflows: ["payments-pull"]   # 2026-10-19: was ["cusum-pull", "payments-pull"].
    # payments-pull is itself triggered by cusum-pull, so listening to both fired
    # this job twice per heartbeat and the second one was almost always cancelled:
    # 86 cancellations against 31 successes, the worst ratio in the repo.
    types: [completed]
  push:
    # Auto-run when the dashboard code or pull script changes (e.g. this first commit),
    # so the seed activation-data.js is immediately replaced with a live pull.
    branches: [master]
    paths:
      - "activated-payments/**"

concurrency:
  # The heartbeat gets its own lane. GitHub keeps at most one PENDING run per group and drops
  # older ones, so once cusum-pull started chaining into this workflow every few minutes, a
  # deliberate manual dispatch could be dropped by a heartbeat no-op queued behind it — which is
  # exactly what happened on 2026-08-27. Separating the lanes means a heartbeat can never cancel
  # a run someone asked for. Two real pulls still cannot overlap in practice: a dispatch leaves
  # the data fresh, so the next heartbeat gates itself out.
  #
  # THAT LAST SENTENCE IS CONDITIONAL ON THE PULL SUCCEEDING, and on 2026-10-09 it did not.
  # A failing pull never commits, so the data never goes fresh, so every heartbeat gates ITSELF
  # IN — and once the fix landed, four real pulls stacked up at once, all scanning receipts on
  # the same warehouse. Harmless but wasteful, and worth knowing before trusting the lanes to
  # keep things apart: they separate heartbeat from deliberate, not pull from pull. Left as is
  # rather than regrouped, because collapsing the lanes is what caused the 2026-08-27 incident
  # above; the gate annotations now make a pile-up visible in the run list instead.
  group: activated-payments-pull-${{ github.event_name == 'workflow_run' && 'heartbeat' || 'direct' }}
  cancel-in-progress: false

jobs:
  pull-and-deploy:
    # A parent pull that failed or was cancelled has produced no new data, so
    # there is nothing for this job to pick up. Guarded 2026-10-19; push, cron
    # and manual dispatch are deliberately unaffected.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The staleness gate reads funnel-data.js's last commit time, so this needs SOME
          # history — but not all of it. fetch-depth: 0 clones every version of every file
          # ever committed, which in this repository is 9.5 GB and had turned checkout into
          # a multi-minute step on every run. funnel-data.js is rewritten by this very job,
          # so it is touched far more often than once in 50 commits; and if the gate cannot
          # find it, it falls back to age 0 and RUNS rather than skipping, which is the safe
          # direction to fail in.
          fetch-depth: 50

      # Only meaningful for the cusum heartbeat, which fires far more often than this job should
      # run. Every other trigger — manual, push, or the cron on the days it works — is deliberate
      # and passes straight through. Staleness is measured from the COMMIT TIME of the generated
      # data rather than from run history: it is the thing the dashboard actually serves, so a run
      # that succeeded but committed nothing does not count as fresh.
      - name: Skip unless the data is stale
        id: gate
        run: |
          MAX_AGE_MIN=170          # just under 3h, so a 3-hourly rhythm is never skipped by drift
          LAST=$(git log -1 --format=%ct -- activated-payments/funnel-data.js || echo 0)
          NOW=$(date -u +%s)
          AGE=$(( (NOW - LAST) / 60 ))
          echo "data last committed ${AGE} min ago (limit ${MAX_AGE_MIN})"
          # A SKIPPED RUN AND A REAL ONE MUST NOT LOOK THE SAME. Both end green, so the run
          # list used to show a wall of ticks whether or not a single byte of data moved —
          # which is how the overview sat at 13:18 for five hours on 2026-10-09 while the
          # history looked healthy. The notice below becomes an annotation on the run (visible
          # in the LIST, not just inside the run) and the summary line shows on the run page,
          # so "green" now says which kind of green it is.
          # A NEW SNAPSHOT ALWAYS WINS OVER THE FRESHNESS GATE. When payments-pull has just
          # committed one, the profile MUST be rebuilt on it however recently this job ran —
          # skipping would leave the two pages on different vintages, which is the failure the
          # shared snapshot exists to prevent. Only the cusum heartbeat is allowed to gate out.
          if [ "${{ github.event.workflow_run.name }}" = "payments-pull" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "payments-pull just published a new snapshot — rebuilding the profile on it"
            echo "::notice title=Pull RUNNING::new shared snapshot from payments-pull — rebuilding so both payments pages stay on one vintage"
            echo "### ✅ Pulling — payments-pull published a new shared snapshot" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "triggered by ${{ github.event_name }} — running regardless of age"
            echo "::notice title=Pull RUNNING::manual/${{ github.event_name }} trigger — refreshing regardless of age (data ${AGE} min old)"
            echo "### ✅ Pulling — triggered by \`${{ github.event_name }}\`, data was ${AGE} min old" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$AGE" -ge "$MAX_AGE_MIN" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pull RUNNING::data is ${AGE} min old (limit ${MAX_AGE_MIN}) — refreshing"
            echo "### ✅ Pulling — data was ${AGE} min old, over the ${MAX_AGE_MIN} min limit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "fresh enough — skipping"
            echo "::notice title=SKIPPED — no data refreshed::data is only ${AGE} min old (limit ${MAX_AGE_MIN}); nothing was pulled, written or committed"
            echo "### ⏭️ Skipped — NO DATA REFRESHED" >> "$GITHUB_STEP_SUMMARY"
            echo "Data is ${AGE} min old, under the ${MAX_AGE_MIN} min limit. Nothing was pulled, written or committed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A green tick on this run means the gate declined to work, **not** that the dashboard was updated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: npm install snowflake-sdk

      - name: Write Snowflake private key
        if: steps.gate.outputs.run == 'yes'
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > snowflake_tars_key.p8

      - name: Run payments activation pull
        if: steps.gate.outputs.run == 'yes'
        env:
          # Optional. Only used to resolve terminal reader ids to device models (M2 / S710 / Tap
          # to Phone), which the Stripe data share does not replicate for connected accounts.
          # Absent, the pull still succeeds and the Payment Profile page falls back to showing how
          # the card was read. Needs Terminal read access only.
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: node activated-payments/pull.js

      # ── DO THE TWO PAYMENTS PAGES AGREE? ──────────────────────────────────────
      # Both are now built from one snapshot taken at one instant, so they should agree to
      # rounding. This asserts it on every run rather than trusting it, because every previous
      # cause of disagreement — face-value FX, two rates for one currency, a discarded fee
      # bucket, two separate pulls — was invisible until somebody put the pages side by side.
      #
      # Runs BEFORE the commit, so a build that would publish contradictory numbers fails
      # instead of shipping them. It does not block the rest of the data: if margins-data.js is
      # absent the check skips, and it only ever compares what both pages actually state.
      - name: Reconcile Margins against Payment Profile
        if: steps.gate.outputs.run == 'yes'
        run: python3 shared/reconcile.py

      - name: Verify report registration source
        if: steps.gate.outputs.run == 'yes'
        run: |
          node -e "const f=require('./activated-payments/registration-daily.json'); if(f.schema_version!==1 || f.timezone!=='Europe/London' || !f.generated_at || !f.days || !Object.keys(f.days).length) process.exit(1); for(const d of Object.values(f.days)) if(d.total!==Object.values(d.by_country).reduce((a,b)=>a+b,0)) process.exit(1);"
          test -s activated-payments/funnel-data.js

      # ── Attachment rate ────────────────────────────────────────────────────────
      # Of the money crossing these merchants' tills, how much comes through Loyverse
      # Payments. GUARDED and non-fatal, on the same rule as every other addition here: the
      # payments data above is the critical deliverable and must not be lost to a new query.
      # Without this step attach-data.js keeps its last committed value and the tile simply
      # shows yesterday's figure.
      #
      # PYTHON IN AN OTHERWISE NODE PIPELINE. The aggregation is pandas because the rolling
      # windows and per-merchant medians are a dozen lines there and a hundred in hand-rolled
      # JS. Worth the extra runtime rather than porting it; if this pipeline ever drops
      # Python, the port is build_attach_data.py and nothing else.
      - name: Set up Python for the attachment build
        if: steps.gate.outputs.run == 'yes'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Attachment rate -> attach-data.js
        if: steps.gate.outputs.run == 'yes'
        continue-on-error: true
        # The denominator is a full scan of LOYVERSE_RECEIPTS, which has no clustering key,
        # so filtering to ~100 merchants costs the same as asking for everyone: ~12 minutes.
        timeout-minutes: 30
        run: |
          pip install --quiet pandas
          node activated-payments/run_attach.js
          python3 activated-payments/build_attach_data.py
        env:
          ATTACH_CSV: ${{ github.workspace }}/activated-payments/work/attach_rate_daily.csv
          ATTACH_OUT: ${{ github.workspace }}/activated-payments/attach-data.js

      - name: Commit & push if the data changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "payments-bot"
          git config user.email "payments-bot@users.noreply.github.com"
          # Only the generated data + discovery artifact — never the dashboard source.
          git add activated-payments/attach-data.js activated-payments/activation-data.js activated-payments/overview-data.js activated-payments/funnel-data.js activated-payments/registration-daily.json activated-payments/report-data.js activated-payments/profile-data.js activated-payments/_discovery.json "KPI Dashboard v2 (Caio)/payments-cohort.json" fraud-health/private/representatives.json
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
          else
            git commit -m "chore(payments): daily activation pull $(date -u +%FT%TZ)"
            # Other daily pulls (CASE 06:00, FACADASH 04:00, cusum hourly) can advance
            # master while we run, causing a non-fast-forward push. We only write files
            # under activated-payments/, which no other workflow touches, so rebasing on
            # top of their commits never conflicts. Retry up to 5 times.
            # Generated files: the newest generation wins, so re-parent rather than merge.
            # `git pull --rebase` tries to MERGE our regenerated files with the remote copy;
            # machine-written files are unmergeable and the rebase fails identically on every
            # attempt. `reset --soft` moves HEAD to the current remote while KEEPING our index,
            # rebuilding the commit on top of origin/master with our content — cannot conflict.
            for i in 1 2 3 4 5; do
              git fetch -q origin master || { sleep 5; continue; }
              git reset -q --mixed origin/master
              git add activated-payments/attach-data.js activated-payments/activation-data.js activated-payments/overview-data.js activated-payments/funnel-data.js activated-payments/registration-daily.json activated-payments/report-data.js activated-payments/profile-data.js activated-payments/_discovery.json "KPI Dashboard v2 (Caio)/payments-cohort.json" fraud-health/private/representatives.json
              if git diff --cached --quiet; then
                echo "Remote already has this data — nothing to push."; exit 0
              fi
              git commit -q -m "chore(payments): daily activation pull $(date -u +%FT%TZ)"
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i failed (remote moved) — retrying in 5s"
              sleep 5
            done
            echo "push still failing after 5 attempts"; exit 1
          fi

      - name: Clean up key
        if: always()
        run: rm -f snowflake_tars_key.p8
